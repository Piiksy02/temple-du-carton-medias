<style>
/* Layout : bandeau de marque collant + onglets, contenu en colonne 1100px, fiches en panneau modal.
   Charte par défaut : vert profond + or du Temple du Carton, modifiable dans Réglages (couleur, logo, nom). */
:root{
  --brand:#04271B; --on-brand:#F4F1E6; --gold:#D49404;
  --bg:#F2F4F1; --surface:#FFFFFF; --surface-2:#E8ECE7; --line:#D3DAD3;
  --ink:#13211A; --muted:#5B6A61; --accent:#0E6B47; --on-accent:#FFFFFF;
  --ok:#1B7F4B; --ok-bg:#DDF1E4; --info:#1F5FA8; --info-bg:#DEE9F7;
  --warn:#9A6200; --warn-bg:#FBEFD4; --bad:#B42318; --bad-bg:#FBE1DE;
  --display:"Oswald","Arial Narrow",Impact,sans-serif;
  --body:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#07130E; --surface:#0F2019; --surface-2:#173026; --line:#26443A;
  --ink:#E6EEE8; --muted:#9CB0A5; --accent:#4FC08D; --on-accent:#04140C; --gold:#E3A51A;
  --ok:#5BD08F; --ok-bg:#123A26; --info:#7FB0F0; --info-bg:#13294A;
  --warn:#F0B54A; --warn-bg:#3A2A0A; --bad:#FF8A7E; --bad-bg:#43160F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07130E; --surface:#0F2019; --surface-2:#173026; --line:#26443A;
  --ink:#E6EEE8; --muted:#9CB0A5; --accent:#4FC08D; --on-accent:#04140C; --gold:#E3A51A;
  --ok:#5BD08F; --ok-bg:#123A26; --info:#7FB0F0; --info-bg:#13294A;
  --warn:#F0B54A; --warn-bg:#3A2A0A; --bad:#FF8A7E; --bad-bg:#43160F; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body.gratuit .pay{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
a{color:var(--accent)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--on-brand);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.brandrow{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--gold);color:#04271B;font-family:var(--display);font-size:16px;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.brandname{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:.02em;line-height:1.1;text-transform:uppercase}
.brandsub{font-size:12px;opacity:.75;letter-spacing:.06em;text-transform:uppercase}
.brandrow .spacer{flex:1}
.scanbtn{background:var(--gold);color:#1a1200;border:0;border-radius:999px;padding:8px 16px;font-weight:600;cursor:pointer;display:flex;gap:8px;align-items:center}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{color:var(--on-brand);opacity:.72;text-decoration:none;padding:9px 14px 11px;font-family:var(--display);font-weight:500;letter-spacing:.06em;text-transform:uppercase;font-size:14px;white-space:nowrap;border-bottom:3px solid transparent}
nav.tabs a.on{opacity:1;border-bottom-color:var(--gold)}
main{padding-block:22px 60px}
h1{font-family:var(--display);font-weight:600;font-size:26px;letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:500;font-size:18px;letter-spacing:.05em;text-transform:uppercase;margin:0 0 10px;color:var(--muted)}
h3{font-size:16px;margin:0}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:18px}
.head .grow{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:24px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.kpi .v{font-family:var(--display);font-size:30px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.kpi.alert .v{color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
@media (max-width:400px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer;min-width:0}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-dispo{background:var(--ok-bg);color:var(--ok)}
.p-loue{background:var(--info-bg);color:var(--info)}
.p-retard{background:var(--bad-bg);color:var(--bad)}
.p-indispo{background:var(--surface-2);color:var(--muted)}
.p-warn{background:var(--warn-bg);color:var(--warn)}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:160px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.game{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.game:hover{border-color:var(--accent)}
.game .ph{aspect-ratio:4/3;max-width:100%;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);font-family:var(--display);font-size:34px}
.game .ph img{width:100%;height:100%;object-fit:cover}
.game .b{padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--surface-2);border-radius:4px;padding:1px 6px}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.scroll{overflow-x:auto}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 14px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label,.lbl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.f label.btn{font-size:inherit;font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink)}
.f input,.f select,.f textarea{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%}
.f textarea{min-height:80px;resize:vertical}
.check{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.check input{margin-top:4px;width:17px;height:17px;flex:none;accent-color:var(--accent)}
fieldset{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin:0;min-width:0}
legend{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:14px;padding:0 6px;color:var(--accent)}
.pieces{display:flex;flex-direction:column;gap:6px}
.piece{display:grid;grid-template-columns:minmax(0,1fr) 64px 80px 34px;gap:6px}
body.gratuit .piece{grid-template-columns:minmax(0,1fr) 64px 34px}
.piecehead{display:grid;grid-template-columns:minmax(0,1fr) 64px 80px 34px;gap:6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
body.gratuit .piecehead{grid-template-columns:minmax(0,1fr) 64px 34px}
.piece input{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);min-width:0}
.pcheck{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px dashed var(--line)}
.pcheck:first-child{border-top:0}
.pcheck input[type=number]{width:72px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.pcheck.miss .pn{color:var(--bad);font-weight:600}
.itemhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.itemhead b{flex:1;min-width:0}
.itemhead select{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.sel{display:flex;flex-direction:column;gap:6px}
.selrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.selrow .main{flex:1;min-width:0}
.sig{width:100%;height:150px;border:1px dashed var(--muted);border-radius:8px;background:#fff;touch-action:none;display:block}
.callout{border-radius:8px;padding:10px 12px;font-size:14px}
.callout.warn{background:var(--warn-bg);color:var(--warn)}
.callout.bad{background:var(--bad-bg);color:var(--bad)}
.callout.info{background:var(--info-bg);color:var(--info)}
.callout.ok{background:var(--ok-bg);color:var(--ok)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);cursor:zoom-in}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .rm{position:absolute;top:2px;right:2px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;line-height:1}
.addphoto{width:84px;height:84px;border:1px dashed var(--muted);border-radius:8px;display:grid;place-items:center;text-align:center;font-size:12px;color:var(--muted);cursor:pointer;padding:4px}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(4,20,12,.55);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:max(20px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:780px;box-shadow:0 20px 60px rgba(0,0,0,.35);min-width:0}
.modal .mh{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal .mh h1{font-size:21px;flex:1;min-width:0}
.modal .mb{padding:18px;display:flex;flex-direction:column;gap:16px}
.modal .mf{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line)}
.x{border:0;background:transparent;font-size:24px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
.lightbox{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.9);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.dl{display:grid;grid-template-columns:minmax(120px,auto) minmax(0,1fr);gap:6px 14px;margin:0}
.dl dt{color:var(--muted);font-size:13px}
.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.qrbox{background:#fff;border-radius:10px;padding:10px;width:180px;max-width:100%}
.qrbox svg{display:block;width:100%;height:auto}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.label{border:1px dashed var(--line);border-radius:8px;padding:10px;text-align:center;background:#fff;color:#111}
.label svg{width:110px;height:110px}
.label b{display:block;font-size:13px}
.scanbox{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:4/3;max-width:100%;width:520px}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanbox .frame{position:absolute;inset:18%;border:3px solid var(--gold);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:95;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.banner{font-size:13px;padding:8px 12px;border-radius:8px;background:var(--surface-2);color:var(--muted);margin-bottom:16px;display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner .grow{flex:1;min-width:200px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:4px 0}
.day{min-height:78px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;text-align:left;color:var(--ink)}
.day.out{opacity:.45}
.day.today{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.day.sel{background:var(--surface-2);border-color:var(--ink)}
.day .n{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.bar{font-size:11px;line-height:1.3;border-radius:4px;padding:1px 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.bar.b-loue{background:var(--info-bg);color:var(--info)}
.bar.b-resa{background:var(--warn-bg);color:var(--warn)}
.bar.b-retard{background:var(--bad-bg);color:var(--bad)}
.more{font-size:11px;color:var(--muted)}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
@media (max-width:640px){.day{min-height:52px}.day .bar,.day .more{display:none}.dots{display:flex}}
@media (max-width:560px){.brandsub{display:none}.scanbtn span{display:none}h1{font-size:22px}.dl{grid-template-columns:110px minmax(0,1fr);gap:6px 10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{header.top,.noprint,.toast{display:none!important}.overlay{position:static;background:none;padding:0}.modal{box-shadow:none}}
</style>

<script>
"use strict";
/* ================= Outils ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+Number(n||0));return iso(d)};
const diffDays=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
const fd=s=>{if(!s)return"—";const[y,m,d]=s.split("-");return d+"/"+m+"/"+y};
const fdLong=s=>s?new Date(s+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"}):"";
const eur=n=>(Number(n)||0).toLocaleString("fr-FR",{style:"currency",currency:"EUR"});
const num=v=>{const n=parseFloat(String(v??"").replace(",","."));return isNaN(n)?0:n};
const framed=(()=>{try{return window.self!==window.top}catch(e){return true}})();
/* dans la page claude.ai, ouvrir directement l'appareil photo donne un écran noir : on passe par le choix du téléphone (Prendre une photo / Photothèque) */
const CAP=framed?"":'capture="environment"';
const ETATS=["Neuf","Très bon","Bon","Usé","Abîmé"];
function toast(msg){$$(".toast").forEach(x=>x.remove());const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

/* ================= Stockage =================
   - page claude.ai : base de données de l'artefact (synchronisée)
   - version autonome : IndexedDB du navigateur (beaucoup de place, photos comprises)
   - secours : localStorage (sans photos), puis mémoire */
const COLS=["jeux","clients","locations","reglages"];
const NS="locjeux:"+location.pathname;
const LKEY="locjeux_v1:"+location.pathname;
const idbReq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open(NS,1);r.onupgradeneeded=()=>{r.result.createObjectStore("kv");r.result.createObjectStore("photos")};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error("bloqué"))})}
const Store={mode:"memory",db:null,idb:null,mem:{},data:{jeux:{},clients:{},locations:{},reglages:{}},
  reset(){this.data={jeux:{},clients:{},locations:{},reglages:{}}},
  async init(){
    try{
      if(window.claude&&typeof claude.use==="function"){
        const db=await Promise.race([claude.use("db"),new Promise(r=>setTimeout(()=>r(null),10000))]);
        if(db){for(const c of COLS){const snap=await db.collection(c).limit(1000).get();snap.docs.forEach(d=>{this.data[c][d.id]=d.data()})}
          this.db=db;this.mode="cloud";return}
      }
    }catch(e){console.warn("Stockage synchronisé indisponible",e);this.reset()}
    try{
      if(!window.indexedDB)throw new Error("pas d'IndexedDB");
      this.idb=await idbOpen();
      const st=this.idb.transaction("kv").objectStore("kv");
      const [keys,vals]=await Promise.all([idbReq(st.getAllKeys()),idbReq(st.getAll())]);
      keys.forEach((k,i)=>{const [c,id]=String(k).split("/");if(this.data[c])this.data[c][id]=vals[i]});
      this.mode="idb";
      const old=lsGet(LKEY);
      if(old&&!keys.length){try{const d=JSON.parse(old);COLS.forEach(c=>Object.values(d[c]||{}).forEach(r=>this.put(c,r)))}catch(e){}}
      if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
      return;
    }catch(e){console.warn("IndexedDB indisponible",e);this.idb=null;this.reset()}
    try{const raw=localStorage.getItem(LKEY);if(raw){const d=JSON.parse(raw);COLS.forEach(c=>this.data[c]=d[c]||{})}this.mode="local"}catch(e){this.mode="memory"}
  },
  all(c){return Object.values(this.data[c])},
  get(c,id){return this.data[c][id]},
  put(c,rec){rec=JSON.parse(JSON.stringify(rec));this.data[c][rec.id]=rec;
    const err=e=>toast("Erreur d'enregistrement : "+(e&&(e.message||e.code)||"inconnue"));
    if(this.mode==="cloud")this.db.collection(c).doc(rec.id).set(rec).catch(err);
    else if(this.mode==="idb"){try{const tx=this.idb.transaction("kv","readwrite");tx.objectStore("kv").put(rec,c+"/"+rec.id);tx.onerror=()=>err(tx.error)}catch(e){err(e)}}
    else if(this.mode==="local"){try{localStorage.setItem(LKEY,JSON.stringify(this.data))}catch(e){toast("Mémoire pleine sur cet appareil : exportez une sauvegarde.")}}
    return rec},
  del(c,id){delete this.data[c][id];
    if(this.mode==="cloud")this.db.collection(c).doc(id).delete().catch(()=>{});
    else if(this.mode==="idb"){try{this.idb.transaction("kv","readwrite").objectStore("kv").delete(c+"/"+id)}catch(e){}}
    else if(this.mode==="local"){try{localStorage.setItem(LKEY,JSON.stringify(this.data))}catch(e){}}},
  photosOK(){return this.mode!=="local"},
  async putPhoto(id,data){
    if(this.mode==="cloud")return this.db.collection("photos").doc(id).set({id,data});
    if(this.mode==="idb")return new Promise((res,rej)=>{const tx=this.idb.transaction("photos","readwrite");tx.objectStore("photos").put(data,id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});
    this.mem[id]=data},
  async getPhoto(id){try{
    if(this.mode==="cloud"){const d=await this.db.collection("photos").doc(id).get();return(d.data()||{}).data||null}
    if(this.mode==="idb")return await idbReq(this.idb.transaction("photos").objectStore("photos").get(id))||null;
    return this.mem[id]||null}catch(e){return null}},
  delPhoto(id){if(this.mode==="cloud")this.db.collection("photos").doc(id).delete().catch(()=>{});else if(this.mode==="idb"){try{this.idb.transaction("photos","readwrite").objectStore("photos").delete(id)}catch(e){}}else delete this.mem[id]}
};

/* ================= Règles métier ================= */
/* une location contient un ou plusieurs jeux (items) ; les anciennes fiches à un seul jeu sont converties à la volée */
function norm(l){if(!l.items){l.items=l.jeuId?[{jeuId:l.jeuId,tarif:l.tarif,caution:l.caution,piecesDepart:l.piecesDepart||[],piecesRetour:l.piecesRetour,etatDepart:l.etatDepart,etatRetour:l.etatRetour}]:[]}
  l.photosDepart=l.photosDepart||[];l.photosRetour=l.photosRetour||[];l.rappels=l.rappels||[];return l}
const LOCS=()=>Store.all("locations").map(norm);
const jeuIds=l=>l.items.map(i=>i.jeuId);
const isOpen=l=>l.statut==="en_cours"||l.statut==="reservee";
const activeLoc=jeuId=>LOCS().find(l=>l.statut==="en_cours"&&jeuIds(l).includes(jeuId));
function locState(l){if(l.statut==="annulee")return"annulee";if(l.statut==="nonrendu")return"nonrendu";if(l.statut==="reservee")return l.dateDepart<today()?"resa_passee":"reservee";if(l.statut!=="en_cours")return"rendue";return l.dateRetourPrevue<today()?"retard":"en_cours"}
const occEnd=l=>l.statut==="en_cours"&&l.dateRetourPrevue<today()?"9999-12-31":l.dateRetourPrevue;
function conflict(jeuId,dep,ret,exceptId){return LOCS().find(l=>l.id!==exceptId&&isOpen(l)&&jeuIds(l).includes(jeuId)&&l.dateDepart<=ret&&dep<=occEnd(l))||null}
const isLateOut=l=>l.statut==="en_cours"&&l.dateRetourPrevue<today();
const cautionEncaissable=l=>!G()&&l.statut==="en_cours"&&l.cautionStatut==="detenue"&&num(l.caution)>0&&lateDays(l)>=(num(S().delaiEncaissement)||20);
const recentRappel=(l,jours)=>l.rappels.some(r=>diffDays(r.date,today())<jours);
/* rappels à faire aujourd'hui : veille du retour, ou retard sans relance depuis 3 jours */
const rappelsDuJour=()=>LOCS().filter(l=>l.statut==="en_cours"&&Store.get("clients",l.clientId)&&((l.dateRetourPrevue===addDays(today(),1)&&!recentRappel(l,1))||(isLateOut(l)&&!recentRappel(l,3))));
const conflictText=cf=>isLateOut(cf)?`Pas encore rendu : en retard depuis le ${fd(cf.dateRetourPrevue)} (${clientName(Store.get("clients",cf.clientId))})`:`Déjà ${cf.statut==="reservee"?"réservé":"loué"} du ${fd(cf.dateDepart)} au ${fd(cf.dateRetourPrevue)} (${clientName(Store.get("clients",cf.clientId))})`;
/* jeux d'une réservation encore dehors chez un autre client, en retard */
const resaBloquee=l=>l.statut==="reservee"?l.items.filter(i=>{const a=activeLoc(i.jeuId);return a&&a.id!==l.id&&isLateOut(a)}).map(i=>jeuNom(i.jeuId)):[];
const nextResa=jeuId=>LOCS().filter(l=>l.statut==="reservee"&&jeuIds(l).includes(jeuId)).sort((a,b)=>a.dateDepart.localeCompare(b.dateDepart))[0]||null;
function jeuState(j){const l=activeLoc(j.id);if(l)return locState(l)==="retard"?"retard":"loue";return j.indisponible?"indispo":"dispo"}
const JEU_PILL={dispo:["p-dispo","Disponible"],loue:["p-loue","Loué"],retard:["p-retard","En retard"],indispo:["p-indispo","Indisponible"]};
const LOC_PILL={en_cours:["p-loue","En cours"],retard:["p-retard","En retard"],rendue:["p-dispo","Rendu"],reservee:["p-warn","Réservée"],resa_passee:["p-retard","Réservation non retirée"],annulee:["p-indispo","Annulée"],nonrendu:["p-retard","Non rendu · caution encaissée"]};
const pill=([c,t])=>`<span class="pill ${c}">${t}</span>`;
const clientName=c=>c?((c.prenom?c.prenom+" ":"")+(c.nom||"")+(c.societe?" · "+c.societe:"")).trim():"Client supprimé";
const jeuNom=id=>(Store.get("jeux",id)||{}).nom||"Jeu supprimé";
const locTitle=l=>{const n=l.items.length;if(!n)return"Aucun jeu";return jeuNom(l.items[0].jeuId)+(n>1?` + ${n-1} autre${n>2?"s":""} jeu${n>2?"x":""}`:"")};
const jeuxPhrase=l=>{const ns=l.items.map(i=>jeuNom(i.jeuId));return ns.length<=1?(ns[0]||""):ns.slice(0,-1).join(", ")+" et "+ns[ns.length-1]};
const lateDays=l=>{if(l.statut==="reservee"||l.statut==="annulee")return 0;const end=l.statut==="en_cours"?today():(l.dateRetour||l.dateNonRendu||today());return Math.max(0,diffDays(l.dateRetourPrevue,end))};
const piecesTotal=j=>(j.pieces||[]).reduce((a,p)=>a+(Number(p.qte)||0),0);
function nextCode(){const p=(S().prefixe||"JEU").toUpperCase();let n=1;const codes=new Set(Store.all("jeux").map(j=>j.code));while(codes.has(p+"-"+String(n).padStart(4,"0")))n++;return p+"-"+String(n).padStart(4,"0")}
function nextLocNum(){const y=new Date().getFullYear(),set=new Set(Store.all("locations").map(l=>l.numero));let n=Store.all("locations").filter(l=>(l.numero||"").startsWith("LOC-"+y)).length+1;while(set.has("LOC-"+y+"-"+String(n).padStart(4,"0")))n++;return"LOC-"+y+"-"+String(n).padStart(4,"0")}
const CAUTION_STATUT={detenue:"Détenue",restituee:"Restituée",partielle:"Retenue en partie",encaissee:"Encaissée",aucune:"Sans caution"};

/* ================= QR ================= */
function qrSvg(text){try{const q=qrcode(0,"M");q.addData(text);q.make();return q.createSvgTag({cellSize:4,margin:2,scalable:true})}catch(e){return'<div class="muted small">QR indisponible</div>'}}
function qrCanvas(text,size){const q=qrcode(0,"M");q.addData(text);q.make();const n=q.getModuleCount(),m=2,cell=Math.floor(size/(n+2*m));const c=document.createElement("canvas");c.width=c.height=cell*(n+2*m);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.fillStyle="#000";for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect((k+m)*cell,(r+m)*cell,cell,cell);return c}
async function detectIn(source,w,h){
  if("BarcodeDetector"in window){try{const d=new BarcodeDetector({formats:["qr_code"]});const r=await d.detect(source);if(r[0])return r[0].rawValue}catch(e){}}
  if(typeof jsQR!=="function")return null;
  const c=detectIn.c||(detectIn.c=document.createElement("canvas"));const s=Math.min(1,900/Math.max(w,h));c.width=Math.round(w*s);c.height=Math.round(h*s);
  const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(source,0,0,c.width,c.height);
  const r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height,{inversionAttempts:"attemptBoth"});return r?r.data:null}
function decodeFile(file){return new Promise(res=>{const img=new Image();img.onload=async()=>{res(await detectIn(img,img.naturalWidth,img.naturalHeight));URL.revokeObjectURL(img.src)};img.onerror=()=>res(null);img.src=URL.createObjectURL(file)})}
function findByCode(raw){let code=String(raw).trim();const m=code.match(/[?&#]jeu=([^&]+)/i);if(m)code=decodeURIComponent(m[1]);code=code.toUpperCase();return Store.all("jeux").find(j=>(j.code||"").toUpperCase()===code)||null}

let downloadsCap=null;
async function saveFile(filename,data,mime){
  const blob=data instanceof Blob?data:new Blob([data],{type:mime||"application/octet-stream"});
  if(downloadsCap){try{await downloadsCap.save({filename,data:blob});return true}catch(e){if(e&&e.code==="declined")return false;toast("Téléchargement impossible ici ("+(e.code||"erreur")+")");return false}}
  if(framed){toast("Le téléchargement n'est pas disponible dans cet aperçu.");return false}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return true}
function canShareFile(){try{return!framed&&!!navigator.canShare&&navigator.canShare({files:[new File(["x"],"x.json",{type:"application/json"})]})}catch(e){return false}}
async function shareFile(filename,data,mime){const f=new File([data],filename,{type:mime});try{await navigator.share({files:[f],title:filename});return true}catch(e){if(e&&e.name==="AbortError")return false;return saveFile(filename,data,mime)}}
const canvasBlob=c=>new Promise(r=>c.toBlob(r,"image/png"));
function resizeImage(file,max=520,q=.72){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",q))};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

function lightbox(src){const d=document.createElement("div");d.className="lightbox";d.innerHTML=`<img src="${esc(src)}" alt="Photo">`;d.onclick=()=>d.remove();document.body.appendChild(d)}
/* champ photos : les nouvelles photos ne sont enregistrées qu'à la validation du formulaire */
function photoField(el,existing=[]){
  const pending=[];let kept=[...existing];
  const draw=()=>{el.innerHTML=`<div class="thumbs">${kept.map(id=>`<div class="thumb" data-id="${id}"><img alt="Photo enregistrée"><button type="button" class="rm" data-rm="${id}" aria-label="Retirer">×</button></div>`).join("")}${pending.map((p,i)=>`<div class="thumb"><img src="${p.data}" alt="Nouvelle photo"><button type="button" class="rm" data-rmp="${i}" aria-label="Retirer">×</button></div>`).join("")}
    ${Store.photosOK()?`<label class="addphoto">+ Photo<input type="file" accept="image/*" ${CAP} multiple hidden></label>`:'<span class="small muted">Photos indisponibles sur ce navigateur.</span>'}</div>`;
    kept.forEach(id=>Store.getPhoto(id).then(src=>{const im=$(`[data-id="${id}"] img`,el);if(im&&src)im.src=src}));
    $$("[data-rm]",el).forEach(b=>b.onclick=e=>{e.stopPropagation();kept=kept.filter(x=>x!==b.dataset.rm);draw()});
    $$("[data-rmp]",el).forEach(b=>b.onclick=e=>{e.stopPropagation();pending.splice(+b.dataset.rmp,1);draw()});
    $$(".thumb",el).forEach(t=>t.onclick=()=>{const im=$("img",t);if(im.src)lightbox(im.src)});
    const inp=$("input[type=file]",el);if(inp)inp.onchange=async e=>{for(const f of e.target.files){try{pending.push({id:uid(),data:await resizeImage(f,1100,.62)})}catch(x){}}draw()}};
  draw();
  return{async save(){for(const p of pending){try{await Store.putPhoto(p.id,p.data);kept.push(p.id)}catch(e){toast("Une photo n'a pas pu être enregistrée.")}}pending.length=0;return kept}};
}
function photoStrip(ids){return ids.length?`<div class="thumbs">${ids.map(id=>`<div class="thumb" data-ph="${id}"><img alt="Photo"></div>`).join("")}</div>`:'<span class="small muted">Aucune photo.</span>'}
function bindPhotoStrip(root){$$("[data-ph]",root).forEach(t=>{Store.getPhoto(t.dataset.ph).then(src=>{if(src)$("img",t).src=src});t.onclick=()=>{const s=$("img",t).getAttribute("src");if(s)lightbox(s)}})}

/* ================= Sauvegarde ================= */
const hasData=()=>Store.all("jeux").length+Store.all("locations").length>0;
function backupBanner(){
  if(!hasData())return"";
  const s=S(),freq=Store.mode==="cloud"?30:(num(s.rappelSauvegarde)||7);
  const last=s.derniereSauvegarde;const days=last?Math.floor((Date.now()-last)/864e5):null;
  if(days!==null&&days<freq)return"";
  return`<div class="banner warn"><span class="grow"><b>${days===null?"Aucune sauvegarde pour l'instant.":"Dernière sauvegarde il y a "+days+" jours."}</b> ${Store.mode==="cloud"?"Vos données sont synchronisées, une copie de sécurité reste conseillée.":"Vos données ne sont que sur cet appareil : gardez une copie ailleurs (e-mail, Drive…)."}</span><button class="btn sm" data-act="backup">Sauvegarder maintenant</button></div>`;
}
async function buildBackup(catalogOnly){
  const strip=r=>{const o=Object.assign({},r);delete o.pinHash;delete o.pinSalt;delete o.secoursHash;delete o.pinLen;return o};
  const data={app:"location-jeux",version:2,exporteLe:new Date().toISOString(),type:catalogOnly?"catalogue":"complet",
    jeux:Store.all("jeux").map(j=>catalogOnly?Object.assign({},j,{indisponible:false,manques:""}):j),clients:catalogOnly?[]:Store.all("clients"),locations:catalogOnly?[]:Store.all("locations"),reglages:catalogOnly?[]:Store.all("reglages").map(strip),photos:{}};
  if(!catalogOnly){const ids=new Set();LOCS().forEach(l=>[...l.photosDepart,...l.photosRetour].forEach(i=>ids.add(i)));for(const id of ids){const p=await Store.getPhoto(id);if(p)data.photos[id]=p}}
  return JSON.stringify(data);
}
const slug=()=>(S().nom||"ludo").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\w]+/g,"-").replace(/^-|-$/g,"").toLowerCase();
function openBackup(){
  const share=canShareFile();
  openModal("Sauvegarde",`<p style="margin:0">La sauvegarde contient tous vos jeux, clients, locations et photos. Gardez-la en lieu sûr, hors de cet appareil : envoyez-la par e-mail, sur Google Drive, iCloud ou WhatsApp.</p>
    <p class="small muted" style="margin:0">Pour tout récupérer sur un nouvel appareil : Réglages → Importer une sauvegarde.</p>`,
  `${share?'<button class="btn primary" id="bkShare" type="button">Envoyer la sauvegarde…</button>':""}<button class="btn ${share?"":"primary"}" id="bkDl" type="button">Télécharger le fichier</button>`,
  ()=>{const go=async how=>{toast("Préparation…");const data=await buildBackup(false);const name=`${slug()}-sauvegarde-${today()}.json`;

function vPlanning(){

    <span class="small muted" style="display:flex;gap:10px;flex-wrap:wrap"><span><span class="dot" style="background:var(--info)"></span> En location</span><span><span class="dot" style="background:var(--warn)"></span> Réservé</span><span><span class="dot" style="background:var(--bad)"></span> En retard</span></span></div>

let camStream=null,camRAF=0;
function stopCamera(){if(camRAF)cancelAnimationFrame(camRAF);camRAF=0;if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}}
function vScanner(){
  $("#view").innerHTML=`<div class="head"><h1 class="grow">Scanner un jeu</h1></div>
  <div class="grid2">
    <div class="panel" style="display:flex;flex-direction:column;gap:14px">

      <div class="toolbar" style="margin:0">
        <button class="btn primary" id="camBtn" type="button">Ouvrir la caméra</button>
        <label class="btn" for="qrPhoto">${framed?"Photo du QR code":"Prendre une photo du QR code"}</label>
        <input type="file" id="qrPhoto" accept="image/*" ${CAP} hidden>
      </div>
      ${framed?`<div class="callout info small">Sur téléphone : touchez « Photo du QR code », puis choisissez <b>« Prendre une photo »</b> (ou une photo déjà prise dans la galerie).</div>`:""}
      <div id="scanMsg" class="small muted">Visez le QR code collé sur la boîte : la fiche du jeu s'ouvre et vous propose de le louer, de démarrer sa réservation ou d'enregistrer son retour.</div>
      <form id="manual" class="toolbar" style="margin:0"><input class="search" id="manualCode" placeholder="…ou tapez le code (ex. ${esc((S().prefixe||"JEU").toUpperCase())}-0001)" autocomplete="off" aria-label="Code du jeu"><button class="btn" type="submit">Chercher</button></form>
    </div>
    <div class="panel" id="scanResult"><h2>Résultat</h2><div class="empty">Aucun jeu scanné pour l'instant.</div></div>
  </div>`;
  $("#camBtn").onclick=startCamera;
  $("#qrPhoto").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;$("#scanMsg").textContent="Lecture de la photo…";const code=await decodeFile(f);if(code)handleCode(code);else $("#scanMsg").innerHTML='<span style="color:var(--bad)">Aucun QR code lisible sur la photo. Reprenez-la plus près, bien éclairée et nette.</span>'};
  $("#manual").onsubmit=e=>{e.preventDefault();const v=$("#manualCode").value.trim();if(v)handleCode(v)};

async function startCamera(){
  const msg=$("#scanMsg");
  try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false})}
  catch(e){msg.innerHTML='<span style="color:var(--warn)">La caméra n\'est pas accessible ici. Utilisez « Prendre une photo du QR code » : sur téléphone, l\'appareil photo s\'ouvre directement.</span>';return}
  const v=$("#video");v.srcObject=camStream;$("#scanbox").hidden=false;await v.play().catch(()=>{});
  msg.textContent="Visez le QR code…";$("#camBtn").textContent="Arrêter la caméra";$("#camBtn").onclick=()=>{stopCamera();vScanner()};
  let busy=false,last=0;
  const loop=async t=>{if(!camStream)return;camRAF=requestAnimationFrame(loop);if(busy||t-last<180||!v.videoWidth)return;busy=true;last=t;
    const code=await detectIn(v,v.videoWidth,v.videoHeight);busy=false;
    if(code&&camStream){stopCamera();$("#scanbox").hidden=true;$("#camBtn").textContent="Scanner un autre jeu";$("#camBtn").onclick=startCamera;if(navigator.vibrate)navigator.vibrate(80);handleCode(code)}};
  camRAF=requestAnimationFrame(loop);
}
function handleCode(raw){
  const j=findByCode(raw);const box=$("#scanResult");
  if(!j){if(box){box.innerHTML=`<h2>Résultat</h2><div class="callout warn">Code « ${esc(raw)} » inconnu.</div><div class="toolbar" style="margin-top:12px"><button class="btn primary" id="mkJeu">Créer un jeu avec ce code</button></div>`;$("#mkJeu").onclick=()=>openJeuForm(null,String(raw).trim().toUpperCase())}else toast("Code inconnu : "+raw);return}
  if(box){$("#scanMsg").textContent="Jeu trouvé : "+j.nom;box.innerHTML=`<h2>Résultat</h2>${scanCard(j)}`;bindScanCard(box,j)}else openJeu(j.id);
}

  ${j.indisponible?`<p class="small" style="color:var(--warn)">${esc(j.manques||"Marqué indisponible")}</p>`:""}</div>${j.photo?`<img src="${esc(j.photo)}" alt="" style="width:110px;border-radius:8px">`:""}</div>

async function exportCatalog(){const data=await buildBackup(true);saveFile(`${slug()}-catalogue-${today()}.json`,data,"application/json")}
function importBackup(file){
  const fr=new FileReader();fr.onload=()=>{let d;try{d=JSON.parse(fr.result)}catch(e){toast("Ce fichier n'est pas une sauvegarde valide.");return}
    if(!d||d.app!=="location-jeux"){toast("Ce fichier ne vient pas de cette application.");return}
    const box=$("#importBox"),np=Object.keys(d.photos||{}).length;
    box.innerHTML=`<div class="callout info">Fichier « ${esc(file.name)} » : ${(d.jeux||[]).length} jeux, ${(d.clients||[]).length} clients, ${(d.locations||[]).length} locations${np?`, ${np} photos`:""}.<br>Les éléments déjà présents seront mis à jour, les autres ajoutés.${d.type==="catalogue"?" Vos réglages actuels sont conservés.":""}</div><div class="toolbar" style="margin-top:8px"><button class="btn primary" id="doImport">Importer</button><button class="btn" id="noImport">Annuler</button></div>`;
    $("#noImport").onclick=()=>box.innerHTML="";
    $("#doImport").onclick=async()=>{const keep={};
      ["jeux","clients","locations"].forEach(c=>(d[c]||[]).forEach(r=>{if(r&&r.id)Store.put(c,r)}));
      (d.reglages||[]).forEach(r=>{if(r&&r.id==="general"){const clean=Object.fromEntries(Object.entries(r).filter(([k,v])=>v!=null&&!/^pin|secours/i.test(k)));saveS(Object.assign(clean,keep))}});
      for(const [id,data] of Object.entries(d.photos||{})){try{await Store.putPhoto(id,data)}catch(e){}}
      applyBrand();toast("Import terminé");vReglages()};
  };fr.readAsText(file)}
function exportCSV(){

  const csv="﻿"+[head,...rows].map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(";")).join("\r\n");

}

function labelCanvas(j){
  const s=S(),W=600,H=300,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  x.fillStyle="#fff";x.fillRect(0,0,W,H);x.strokeStyle="#bbb";x.setLineDash([8,6]);x.strokeRect(4,4,W-8,H-8);x.setLineDash([]);
  try{x.drawImage(qrCanvas(j.code,250),25,25,250,250)}catch(e){}
  x.fillStyle="#111";x.font="600 30px Oswald, Arial Narrow, sans-serif";wrapText(x,j.nom.toUpperCase(),295,70,280,34,3);
  x.font="500 24px ui-monospace, Menlo, monospace";x.fillText(j.code,295,190);
  x.font="16px Work Sans, sans-serif";x.fillStyle="#555";x.fillText(`${(j.pieces||[]).length} types de pièces · ${piecesTotal(j)} éléments`,295,222);
  x.fillText((s.nom||"").slice(0,32),295,255);return c;
}
function wrapText(x,t,X,Y,w,lh,max){const words=t.split(" ");let line="",n=0;for(const wd of words){const test=line?line+" "+wd:wd;if(x.measureText(test).width>w&&line){x.fillText(line,X,Y+n*lh);n++;line=wd;if(n>=max-1)break}else line=test}if(n<max)x.fillText(line,X,Y+n*lh)}
function openLabels(){
  const jeux=Store.all("jeux").sort((a,b)=>a.code.localeCompare(b.code));
  openModal("Étiquettes QR",`<p class="small muted" style="margin:0">Collez une étiquette sur chaque boîte (de préférence sous plastique). Chaque étiquette se télécharge en image, ou toutes d'un coup en planche A4.</p>
    ${jeux.length?`<div class="labels">${jeux.map(j=>`<div class="label">${qrSvg(j.code)}<b>${esc(j.nom)}</b><span class="code">${esc(j.code)}</span></div>`).join("")}</div>`:'<div class="empty">Aucun jeu.</div>'}`,
    `${framed?"":'<button class="btn" id="prLab" type="button">Imprimer</button>'}<button class="btn primary" id="dlLab" type="button" ${jeux.length?"":"disabled"}>Télécharger la planche A4 (PNG)</button>`,
    ()=>{if($("#prLab"))$("#prLab").onclick=()=>window.print();
      $("#dlLab").onclick=async()=>{const per=10;for(let p=0;p*per<jeux.length;p++){const page=document.createElement("canvas");page.width=1240;page.height=1754;const x=page.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,1240,1754);
        jeux.slice(p*per,p*per+per).forEach((j,i)=>{x.drawImage(labelCanvas(j),20+(i%2)*610,27+Math.floor(i/2)*340)});
        await saveFile(`etiquettes-qr-page${p+1}.png`,await canvasBlob(page),"image/png")}}});
}

function signaturePad(cv){
  const ctx=cv.getContext("2d");let drawing=false,empty=true;
  const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=Math.max(1,r.width*dpr);cv.height=Math.max(1,r.height*dpr);ctx.scale(dpr,dpr);ctx.lineWidth=2.2;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#111";
  const pos=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  cv.addEventListener("pointerdown",e=>{drawing=true;empty=false;cv.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...pos(e))});
  cv.addEventListener("pointermove",e=>{if(!drawing)return;ctx.lineTo(...pos(e));ctx.stroke()});
  ["pointerup","pointercancel"].forEach(t=>cv.addEventListener(t,()=>drawing=false));
  return{clear:()=>{ctx.clearRect(0,0,cv.width,cv.height);empty=true},isEmpty:()=>empty,
    data:()=>{const c=document.createElement("canvas"),k=Math.min(1,500/cv.width);c.width=cv.width*k;c.height=cv.height*k;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(cv,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.6)}};
}

  ${l.items.map(it=>{const j=Store.get("jeux",it.jeuId)||{};return`<h3>${esc(j.nom||"Jeu")} (${esc(j.code||"")}) · état au départ : ${esc(it.etatDepart||"")}${it.etatRetour?" · au retour : "+esc(it.etatRetour):""}</h3><table><tr><th>Pièce</th><th>Qté</th><th>Départ</th>${it.piecesRetour?"<th>Retour</th>":""}</tr>${(it.piecesDepart||[]).map((p,i)=>{const r=(it.piecesRetour||[])[i];return`<tr><td>${esc(p.nom)}</td><td>${p.qte}</td><td>${p.present?"OK":"Absente"}</td>${it.piecesRetour?`<td>${r&&r.manquant>0?r.manquant+" manquante(s)":"OK"}</td>`:""}</tr>`}).join("")}</table>`}).join("")}
  ${l.notes?`<p><b>Remarques :</b> ${esc(l.notes)}</p>`:""}
  <h3>Conditions</h3><div class="cond">${esc(condTxt())}</div>
  <p>Signature du locataire (conditions acceptées) :</p>${l.signature?`<img class="sig" src="${l.signature}">`:""}
  </body></html>`;
  if(!framed){const w=window.open("","_blank");if(w){w.document.write(html);w.document.close();setTimeout(()=>w.print(),400);return}}
  saveFile(`bon-${l.numero}.html`,html,"text/html");
}

/* ================= Retour ================= */
function openRetourForm(id){
  const l=norm(Store.get("locations",id)),s=S();
  const items=l.items.map(it=>{const j=Store.get("jeux",it.jeuId)||{nom:"Jeu supprimé",pieces:[]};return{it,j,pieces:it.piecesDepart&&it.piecesDepart.length?it.piecesDepart:(j.pieces||[]).map(p=>({nom:p.nom,qte:num(p.qte),present:true}))}});
  openModal("Retour : "+locTitle(l),`<form id="rf" style="display:flex;flex-direction:column;gap:16px">
    <div class="form"><div class="f"><label for="r_date">Date de retour</label><input id="r_date" type="date" required value="${today()}"></div></div>
    ${items.map(({it,j,pieces},k)=>`<fieldset><legend>${esc(j.nom)}</legend>
      <div class="itemhead"><span class="small muted" style="flex:1">Nombre rendu pour chaque pièce</span><label class="small muted" for="r_etat${k}">État</label><select id="r_etat${k}">${ETATS.map(e=>`<option ${e===(it.etatDepart||j.etat||"Très bon")?"selected":""}>${e}</option>`).join("")}</select></div>
      ${pieces.length?pieces.map((p,i)=>`<div class="pcheck"><span class="num muted small">${p.present?"":"absente au départ"}</span><span class="pn">${esc(p.nom)}</span><span><input type="number" min="0" max="${p.qte}" value="${p.present?p.qte:0}" data-rq="${k}-${i}" aria-label="Quantité rendue : ${esc(p.nom)}"> / ${p.qte}</span></div>`).join(""):'<div class="small muted">Aucune liste de pièces.</div>'}
    </fieldset>`).join("")}
    <div id="rSum"></div>
    <fieldset><legend>Photos de l'état au retour</legend><div id="phRet"></div>${l.photosDepart.length?`<div class="lbl" style="margin:10px 0 6px">Pour comparer : photos du départ</div>${photoStrip(l.photosDepart)}`:""}</fieldset>
    <div class="form">
      <div class="f pay"><label for="r_pen">Pénalité de retard (€)</label><input id="r_pen" type="number" step="0.5" min="0"></div>
      <div class="f pay"><label for="r_frais">Pièces manquantes / dégâts (€)</label><input id="r_frais" type="number" step="0.5" min="0" value="0"></div>
      <div class="f pay"><label for="r_ret">Retenue sur la caution (€)</label><input id="r_ret" type="number" step="0.5" min="0"></div>
      <div class="f pay"><label for="r_cstat">Caution</label><select id="r_cstat">${Object.entries(CAUTION_STATUT).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></div>
      <div class="f full"><label for="r_notes">Remarques</label><textarea id="r_notes" rows="2"></textarea></div>
      <label class="check f full"><input type="checkbox" id="r_indispo"><span>Mettre de côté (indisponibles) les jeux incomplets</span></label>
    </div></form>`,`<button class="btn" type="button" id="cancel">Annuler</button><button class="btn primary" type="submit" form="rf">Valider le retour</button>`,
  m=>{
    bindPhotoStrip(m);
    const photos=photoField($("#phRet"));
    let touchedPen=false,touchedSt=false,touchedFrais=false;
    const prixDe=(it,j,p)=>num(p.prix)||num(((j.pieces||[]).find(x=>x.nom===p.nom)||{}).prix);
    const cstat=ret=>num(l.caution)<=0?"aucune":ret<=0?"restituee":ret>=num(l.caution)?"encaissee":"partielle";
    const setRet=()=>{const ret=Math.min(num(l.caution),num($("#r_pen").value)+num($("#r_frais").value));$("#r_ret").value=ret.toFixed(2);if(!touchedSt)$("#r_cstat").value=cstat(ret)};
    const calc=()=>{const late=Math.max(0,diffDays(l.dateRetourPrevue,$("#r_date").value));
      const miss=items.map(({pieces},k)=>pieces.map((p,i)=>{const r=$(`[data-rq="${k}-${i}"]`);const exp=p.present?p.qte:0;const mm=r?Math.max(0,exp-num(r.value)):0;if(r)r.closest(".pcheck").classList.toggle("miss",mm>0);return mm}));
      const nMiss=miss.flat().reduce((a,b)=>a+b,0);
      if(!touchedPen)$("#r_pen").value=(G()?0:late*num(s.penaliteJour)*l.items.length).toFixed(2);
      let frais=0;const sansPrix=[],detail=[];items.forEach(({it,j,pieces},k)=>pieces.forEach((p,i)=>{if(miss[k][i]>0){const px=prixDe(it,j,p);if(px){frais+=px*miss[k][i];detail.push(miss[k][i]+" × "+p.nom+" à "+eur(px))}else sansPrix.push(p.nom)}}));
      if(!touchedFrais)$("#r_frais").value=(G()?0:frais).toFixed(2);
      setRet();$("#r_indispo").checked=nMiss>0;
      $("#rSum").innerHTML=`<div class="callout ${late||nMiss?"warn":"ok"}">${late?`${late} jour(s) de retard. `:"Rendu à temps. "}${nMiss?`${nMiss} élément(s) manquant(s).`:"Tout est complet."}<span class="pay"> Caution déposée : ${eur(l.caution)}.${detail.length?`<br>Pièces : ${esc(detail.join(", "))} = ${eur(frais)}.`:""}${sansPrix.length?`<br>Prix de remplacement non renseigné pour : ${esc(sansPrix.join(", "))} (à saisir à la main ou dans la fiche du jeu).`:""}</span></div>`;return miss};
    $$("[data-rq]").forEach(i=>i.oninput=calc);$("#r_date").onchange=calc;
    $("#r_pen").oninput=()=>{touchedPen=true;setRet()};$("#r_frais").oninput=()=>{touchedFrais=true;setRet()};$("#r_cstat").onchange=()=>touchedSt=true;
    calc();
    $("#cancel").onclick=()=>openLoc(id);
    $("#rf").onsubmit=async e=>{e.preventDefault();const miss=calc();
      if($("#r_date").value<l.dateDepart){toast("La date de retour est avant la date de location.");return}
      const etaitNonRendu=l.statut==="nonrendu";
      l.items=items.map(({it,pieces},k)=>Object.assign(it,{piecesDepart:pieces,etatRetour:$("#r_etat"+k).value,piecesRetour:pieces.map((p,i)=>({nom:p.nom,qte:p.qte,prix:p.prix,manquant:miss[k][i]}))}));
      Object.assign(l,{statut:"rendue",dateRetour:$("#r_date").value,penalite:num($("#r_pen").value),fraisPieces:num($("#r_frais").value),cautionRetenue:num($("#r_ret").value),cautionStatut:$("#r_cstat").value,notesRetour:$("#r_notes").value.trim(),photosRetour:await photos.save()});
      Store.put("locations",l);
      items.forEach(({j,pieces},k)=>{if(!j.id)return;j.etat=$("#r_etat"+k).value;if(etaitNonRendu){j.manques=String(j.manques||"").split(" ; ").filter(x=>!x.startsWith("Non rendu par")).join(" ; ");j.indisponible=false}const lst=pieces.map((p,i)=>miss[k][i]>0?miss[k][i]+" × "+p.nom:"").filter(Boolean);
        if(lst.length){j.manques=(j.manques?j.manques+" ; ":"")+lst.join(", ")+" (retour "+l.numero+")";if($("#r_indispo").checked)j.indisponible=true}
        Store.put("jeux",j)});
      toast("Retour enregistré");render();openLoc(id)};
  });
}
